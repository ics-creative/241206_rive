<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rive Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap"
      rel="stylesheet"
    >
    <script type="module" src="./index.js"></script>
    <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
    }
    *,
    *::after,
    *::before {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .main {
      padding: 64px;
      width: 100%;
      display: grid;
      gap: 160px;
      justify-content: center;
    }
    .wrapper {
      display: grid;
      justify-content: center;
      gap: 48px;
    }
    #star {
      width: 354px;
      height: 360px;
      margin: 0 auto;
    }
    #fish {
      width: 500px;
      height: 500px;
    }
    h2 {
      text-align: center;
    }
    </style>
  </head>
  <body>
    <main class="main">
      <section class="wrapper">
        <h2>Demo 1: Animated Star on Click and Hover</h2>
        <canvas id="star" width="354" height="360"></canvas>
      </section>
      <section class="wrapper">
        <h2>Demo 2: Fish Following the Mouse Cursor</h2>
        <canvas id="fish" width="500" height="500"></canvas>
      </section>
    </main>
  </body>
</html>
